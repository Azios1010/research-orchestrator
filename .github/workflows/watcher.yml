# Poll active Kaggle runs, collect results, report, and commit state/ and results/.
#
# ACTIONS MINUTES (private repository, GitHub Free: about 2,000 minutes a month, and every job is
# rounded up to a whole minute):
#   hourly schedule, nothing to do   about 720-744 minutes a month (37% of the allowance)
#   every 30 minutes                 about 1,440-1,488 minutes a month
#   every 15 minutes                 about 2,900 minutes a month: more than the allowance
# Runs with active kernels cost a few minutes each. To check less often, change the cron line
# below (for example "17 */3 * * *" is about 250 minutes a month), or delete the schedule and
# start this workflow by hand.
name: watcher

on:
  schedule:
    - cron: "17 * * * *" # hourly; GitHub may start scheduled runs late
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # commits state/ and results/
      issues: write # tracking and run-failed issues
    # Shared with dispatch.yml: only one job at a time reads and writes state/.
    concurrency:
      group: lab-state
      cancel-in-progress: false
      # UNVERIFIED: queue: max keeps every waiting run instead of cancelling all but the newest.
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - name: Any active run?
        id: active
        # Standard library only, so an idle check ends within seconds.
        run: |
          python3 - <<'PY'
          import json, os, pathlib

          path = pathlib.Path("state/runs.json")
          runs = json.loads(path.read_text())["runs"] if path.is_file() else []
          active = [r for r in runs if r["status"] in ("QUEUED", "RUNNING", "UNKNOWN")]
          print(f"{len(active)} active run(s)")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"active={'true' if active else 'false'}\n")
          PY
      - name: Fetch history (retries rebuild the exact submitted commit)
        if: steps.active.outputs.active == 'true'
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --unshallow --quiet origin main
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        if: steps.active.outputs.active == 'true'
        with:
          python-version: "3.11"
      - name: Install the lab and the Kaggle CLI
        if: steps.active.outputs.active == 'true'
        run: python -m pip install -e . "kaggle==2.2.5" six
      - name: Watch
        if: steps.active.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # UNVERIFIED: set either KAGGLE_USERNAME + KAGGLE_KEY, or KAGGLE_API_TOKEN.
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ vars.DEEPSEEK_BASE_URL }}
          DEEPSEEK_MODEL: ${{ vars.DEEPSEEK_MODEL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m labcore.watcher.watcher
      - name: Commit state/ and results/
        # Also after a watcher error: other runs may have been processed.
        if: always() && steps.active.outputs.active == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A state results
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "bot(watcher): update state and results"
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then exit 0; fi
            echo "push failed (attempt $attempt): rebasing on main"
            git pull --rebase --autostash origin main
          done
          echo "::error::state/ and results/ could not be pushed"
          exit 1

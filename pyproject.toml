[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "research-lab"
description = "Screening lab: cheap, pre-registered smoke tests for research directions."
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
# Keep this list minimal. Heavy dependencies belong in directions/<slug>/requirements.txt.
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.18",
    "numpy>=1.26",
    "pandas>=2.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.setuptools.dynamic]
version = { attr = "labcore.__version__" }

[tool.setuptools.packages.find]
include = ["labcore*"]

[tool.setuptools.package-data]
labcore = ["schemas/*.json", "diagnose/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests", "directions"]
# importlib mode: several directions may each have tests/test_l0_smoke.py.
addopts = "--import-mode=importlib"
pythonpath = [".", "tests"]
norecursedirs = ["_template", ".git", ".dryrun", ".venv", "venv", "reference", "results", "state"]

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = ["reference", ".dryrun"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Tools put the repo root on sys.path before importing labcore, so they run without installing.
"tools/**/*.py" = ["E402"]
